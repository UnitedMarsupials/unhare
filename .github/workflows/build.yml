name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back; reading the tree is the whole of it.
permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Everything the build wants is in the base system: clang, libelf,
      # bsd.prog.mk, objcopy and xz.  There is nothing to install.
      - name: build and test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            set -e
            make
            make test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install libelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libelf-dev

      # GNU make reads GNUmakefile in preference to anything else, so
      # BSDmakefile is not in the way here.
      - name: build and test
        run: |
          make
          make test
